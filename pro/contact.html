<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCT HUB | ลงทะเบียนแข่งขัน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="test.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-white" href="index.html">VCT <span class="text-danger">HUB</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">หน้าแรก</a></li>
                    <li class="nav-item"><a class="nav-link" href="team.html">ทีมแข่งขัน</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">สมัครแข่ง/ติดต่อ</a></li>
                </ul>
                <a href="contact.html" class="btn btn-vct"><i class="bi bi-controller"></i> JOIN NOW</a>
            </div>
        </div>
    </nav>

    <!-- Form Section -->
    <div class="container mt-5 py-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card vct-card border-0 p-4 shadow-lg text-white">
                    <div class="text-center mb-4">
                        <i class="bi bi-trophy text-danger" style="font-size: 3rem;"></i>
                        <h2 class="fw-bold mt-2">แบบฟอร์มรับสมัครเข้าแข่งขัน</h2>
                        <p class="text-secondary">สมัครเพื่อโอกาสเข้าร่วมศึกทัวร์นาเมนต์ระดับภูมิภาค</p>
                    </div>

                    <form class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="teamName" class="form-label fw-bold">ชื่อสโมสร / ชื่อทีม</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-shield-shaded"></i></span>
                                    <input type="text" class="form-control bg-dark border-secondary text-white" id="teamName" placeholder="เช่น Team Alpha" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="captain" class="form-label fw-bold">ชื่อหัวหน้าทีม (Leader)</label>
                                <input type="text" class="form-control bg-dark border-secondary text-white" id="captain" placeholder="ชื่อ - นามสกุลจริง" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-bold">อีเมลสำหรับติดต่อ</label>
                                <input type="email" class="form-control bg-dark border-secondary text-white" id="email" placeholder="example@gmail.com" required>
                            </div>
                            <div class="col-md-6">
                                <label for="rank" class="form-label fw-bold">ระดับแรงค์เฉลี่ยทีม</label>
                                <select class="form-select bg-dark border-secondary text-white" id="rank" required>
                                    <option value="" selected disabled>เลือกแรงค์ที่ตรงที่สุด...</option>
                                    <option>Silver - Gold</option>
                                    <option>Platinum - Diamond</option>
                                    <option>Ascendant - Immortal</option>
                                    <option>Radiant</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="playerCount" class="form-label fw-bold">จำนวนสมาชิกทีม (รวมสำรอง)</label>
                                <input type="number" class="form-control bg-dark border-secondary text-white" id="playerCount" placeholder="ระบุตัวเลข 5 - 6 คน" required>
                            </div>
                            <div class="col-12">
                                <label for="reason" class="form-label fw-bold">เป้าหมายของทีมหรือข้อความเพิ่มเติม</label>
                                <textarea class="form-control bg-dark border-secondary text-white" id="reason" rows="4" placeholder="บอกเราสั้นๆ ว่าทำไมทีมของคุณต้องเข้าร่วมรายการนี้..."></textarea>
                            </div>
                            <div class="col-12 my-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="agreement" required>
                                    <label class="form-check-label text-secondary small" for="agreement">
                                        ยอมรับเงื่อนไขและกติกาการแข่งขันของ VCT Hub ในการเข้าทดสอบ
                                    </label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-vct btn-lg w-100"><i class="bi bi-send-fill"></i> ส่งใบสมัครเข้าร่วมทีม</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black text-secondary py-5 border-top border-dark">
        <div class="container text-center">
            <h3 class="fw-bold text-white mb-3">VCT <span class="text-danger">HUB</span></h3>
            <p class="small mb-0">&copy; 2026 VCT Hub. จัดทำเพื่อการศึกษา - Assignment 4</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
